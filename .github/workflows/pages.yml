name: Publicar Evolution Radar IA no GitHub Pages

on:
  push:
    branches:
      - desenvolvimento/base-evolution-radar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-evolution-radar
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/desenvolvimento/base-evolution-radar'
    name: Validar e publicar site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ler arquivos do repositório
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar regras e JavaScript
        run: npm run check
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar somente os arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
