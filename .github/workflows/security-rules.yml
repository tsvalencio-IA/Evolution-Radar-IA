name: Validar regras Firebase - apadrinhamento
on:
  push:
    paths:
      - "database.rules.json"
      - "tests/integration/**"
      - "public/team-*.js"
      - "public/team-roles.mjs"
      - "worker/evolution-search-worker.js"
      - ".github/workflows/security-rules.yml"
  pull_request:
    paths:
      - "database.rules.json"
      - "tests/integration/**"
      - "public/team-*.js"
      - "public/team-roles.mjs"
      - "worker/evolution-search-worker.js"
      - ".github/workflows/security-rules.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar somente ferramentas de teste do emulador
        run: npm install --no-save --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Validar autorização e isolamento no emulador local
        run: npx firebase emulators:exec --only database --project demo-evolution-radar "node --test --test-concurrency=1 tests/integration/*.mjs"
